version: 0.2

phases:
  install:
    commands:
      - echo "Setting up Flutter SDK"
      - mkdir -p .flutter_cache
      - |
        if [ ! -d ".flutter_cache/flutter" ]; then
          git clone https://github.com/flutter/flutter.git -b stable .flutter_cache/flutter
        fi
      - export PATH="$PATH:`pwd`/.flutter_cache/flutter/bin"
      - flutter doctor
  pre_build:
    commands:
      - flutter pub get
  build:
    commands:
      - echo "Building with flavor $MOBILE_ENV and API $API_BASE_URL"
      - flutter build apk  --flavor $MOBILE_ENV --target lib/main.dart --release --dart-define=API_BASE_URL=$API_BASE_URL
      - mkdir -p build/devicefarm
      - cp build/app/outputs/flutter-apk/app-$MOBILE_ENV-release.apk build/devicefarm/app-release.apk
      - cd build/devicefarm && zip -j flutter-app.zip app-release.apk pubspec.yaml
        - aws s3 cp flutter-app.zip s3://$ARTIFACT_BUCKET/build/devicefarm/flutter-app.zip

  post_build:
    commands:
      - echo "APK uploaded to S3 at $ARTIFACT_BUCKET/build/devicefarm/flutter-app.zip"

artifacts:
  files:
    - build/devicefarm/flutter-app.zip

cache:
  paths:
    - ".flutter_cache/**/*"
    - "/root/.pub-cache/**/*"
