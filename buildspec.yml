version: 0.2

phases:
  install:
    commands:
      - echo "Setting up Flutter SDK"
      - mkdir -p .flutter_cache
      - |
        if [ ! -d ".flutter_cache/flutter" ]; then
          git clone https://github.com/flutter/flutter.git -b stable .flutter_cache/flutter
        fi
      - export PATH="$PATH:`pwd`/.flutter_cache/flutter/bin"
      - flutter doctor
  pre_build:
    commands:
      - flutter pub get
  build:
    commands:
      - echo "Building with flavor $MOBILE_ENV and API $API_BASE_URL"
      - flutter build apk --flavor $MOBILE_ENV --target lib/main.dart --release --dart-define=API_BASE_URL=$API_BASE_URL
  post_build:
    commands:
      - ls -lah build/app/outputs/flutter-apk || true
      - echo "Build complete"

artifacts:
  files:
    - build/app/outputs/flutter-apk/app-$MOBILE_ENV-release.apk
    - pubspec.yaml
  discard-paths: no

cache:
  paths:
    - ".flutter_cache/**/*"
    - "/root/.pub-cache/**/*"
